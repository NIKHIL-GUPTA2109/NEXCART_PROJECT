<!DOCTYPE html>
<html>
<head>
    <title>Contact Us | NexCart</title>
    <style>
   :root{
    --bg:#f5f6f8;
    --card:#ffffff;
    --text:#222;
    --nav:#131921;
    --accent:#ff9900;
    --shadow:0 4px 15px rgba(0,0,0,.08);
}

.dark-theme{
--bg:#121212;
--card:#1f1f1f;
--text:#f5f5f5;
--nav:#0d1117;
--accent:#ff9900;
--shadow:0 4px 15px rgba(255,255,255,.05);
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    transition:.3s;
}

.contact-container{
    max-width:900px;
    margin:60px auto;
    padding:0 20px;
}

.contact-container h1{
    text-align:center;
    font-size:3rem;
    margin-bottom:15px;
}

.contact-container > p{
    text-align:center;
    color:#9ca3af;
    margin-bottom:35px;
}

.contact-card{
    background:var(--card);
    padding:40px;
    border-radius:20px;
    box-shadow:var(--shadow);
}

.contact-card h3{
    color:#2563eb;
    margin-bottom:10px;
    font-size:1.3rem;
}

.contact-card p{
    font-size:1.05rem;
    color:var(--text);
    margin-bottom:25px;
}

.home-btn{
    display:block;
    width:220px;
    margin:30px auto 0;
    text-align:center;
    padding:14px 20px;
    background:#2563eb;
    color:white;
    text-decoration:none;
    border-radius:10px;
    font-weight:600;
    transition:.3s;
}

.home-btn:hover{
    background:#1d4ed8;
    transform:translateY(-2px);
}

/* MOBILE */

@media(max-width:768px){

    .contact-container{
        margin:30px auto;
    }

    .contact-container h1{
        font-size:2rem;
    }

    .contact-card{
        padding:25px;
    }

    .contact-card h3{
        font-size:1.1rem;
    }

    .contact-card p{
        font-size:1rem;
    }

    .home-btn{
        width:100%;
    }
}

@media(max-width:480px){

    .contact-container h1{
        font-size:1.7rem;
    }

    .contact-card{
        padding:20px;
    }
}
</style>
</head>
<body>

<div class="contact-container">

    <h1>Contact NexCart Team</h1>

    <p>
        Have questions, suggestions, or need support?
        We'd love to hear from you.
    </p>

    <div class="contact-card">

        <h3>📧 Email</h3>
        <p>nikhilgupta002109@gmail.com</p>

        <h3>📞 Phone</h3>
        <p>+91 6396788900</p>

        <h3>📍 Address</h3>
        <p>Gurgaon, Haryana, India</p>

    </div>

    <a href="{% url 'home' %}" class="home-btn">
        Back to Home
    </a>

</div>
<script>
document.addEventListener("DOMContentLoaded", function () {

    if(localStorage.getItem("theme") === "dark"){
        document.body.classList.add("dark-theme");
    }

});
</script>
</body>
</html>
