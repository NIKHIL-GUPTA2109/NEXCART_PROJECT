{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>My Wishlist</title>

    <link
        rel="stylesheet"
        href="{% static 'css/wishlist.css' %}"
    >

</head>

<body>

<div class="container">

    <div class="header">

        <h1>
             My Wishlist
        </h1>

       <a
    href="{% url 'product_list' %}"
    class="continue-btn"
>
    🛍 Continue Shopping
</a>

    </div>

    {% if wishlist_items %}

        <div class="grid">

            {% for item in wishlist_items %}

            <div class="card">

                <img
                    src="{{ item.product.image.url }}"
                    alt="{{ item.product.name }}"
                >

                <h3>
                    {{ item.product.name }}
                </h3>

                <p>
                    ₹{{ item.product.price }}
                </p>

                <a
                    href="{% url 'product_detail' item.product.id %}"
                    class="view-btn"
                >
                    View Product
                </a>

                <a
                    href="{% url 'remove_from_wishlist' item.product.id %}"
                    class="remove-btn"
                >
                    Remove
                </a>

            </div>

            {% endfor %}

        </div>

    {% else %}

        <div class="empty">

            <h2>
                Wishlist Empty
            </h2>

            <p>
                Add products you love.
            </p>

        </div>

    {% endif %}

</div>

</body>

</html>
