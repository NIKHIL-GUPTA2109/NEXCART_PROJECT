<style>

    .products-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:30px;
    padding:30px;
}

.product-card{
    background:#fff;
    border-radius:16px;
    padding:20px;
}

.product-card:hover{
    transform:translateY(-5px);
    box-shadow:0 8px 25px rgba(0,0,0,0.15);
}



.product-card a{
    display:block;
    width:100%;
    height:300px;
    overflow:hidden;
    border-radius:12px;
}

.product-card img{
    width:100%;
    height:100%;
    object-fit:cover;
}
.product-card h3{
    font-size:22px;
    font-weight:600;
    color:#222;
    padding:0 20px;
    margin:15px 0 10px;
    min-height:60px;
}

.product-card p{
    font-size:24px;
    font-weight:700;
    color:#ff9800;
    padding:0 20px 20px;
    margin:0;
}


.page-header{

    width:90%;

    margin:30px auto;

    display:flex;

    align-items:center;

    justify-content:space-between;
}
.page-title{

    margin:0;

    flex:1;

    text-align:center;

    font-size:2.4rem;

    font-weight:700;
}
.back-btn{

    padding:10px 18px;

    background:#111827;

    color:white;

    text-decoration:none;

    border-radius:10px;

    font-weight:600;

    white-space:nowrap;
}

.back-btn:hover{

    background:#2563eb;
}
</style>
<div class="page-header">

    <a href="{% url 'home' %}" class="back-btn">
        ← Home
    </a>

    <h1 class="page-title">
        {{ category }}
    </h1>
    </div>

<div class="products-grid">

{% for product in products %}

<div class="product-card">

    <a href="{% url 'product_detail' product.id %}">
        <img
            src="{{ product.image.url }}"
            alt="{{ product.name }}"
        >
    </a>

    <h3>{{ product.name }}</h3>

    <p>₹{{ product.price }}</p>

</div>

{% endfor %}

</div>
