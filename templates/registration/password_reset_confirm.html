<!DOCTYPE html>
<html>
<head>
    <title>Set New Password | NexCart</title>

    <style>

        body{
            margin:0;
            background:#f5f7fb;

            font-family:Arial,sans-serif;

            display:flex;
            justify-content:center;
            align-items:center;

            height:100vh;
        }

        .card{
            width:450px;

            background:white;

            padding:40px;

            border-radius:18px;

            box-shadow:
            0 10px 30px rgba(0,0,0,.08);
        }

        h1{
            text-align:center;
            color:#111827;
        }

        input{
            width:100%;

            padding:14px;

            border:1px solid #ddd;

            border-radius:10px;

            margin-top:8px;
            margin-bottom:20px;
        }

        button{
            width:100%;

            padding:14px;

            background:#16a34a;

            color:white;

            border:none;

            border-radius:10px;

            cursor:pointer;
        }

        button:hover{
            background:#15803d;
        }

    </style>

</head>

<body>

<div class="card">

    <h1>🔑 Set New Password</h1>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Change Password
        </button>

    </form>

</div>

</body>
</html>
