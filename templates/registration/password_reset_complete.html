<!DOCTYPE html>
<html>
<head>
    <title>Password Changed | NexCart</title>

    <style>

        body{
            margin:0;
            background:#f5f7fb;

            font-family:Arial,sans-serif;

            display:flex;
            justify-content:center;
            align-items:center;

            height:100vh;
        }

        .card{
            width:500px;

            background:white;

            padding:40px;

            text-align:center;

            border-radius:18px;

            box-shadow:
            0 10px 30px rgba(0,0,0,.08);
        }

        h1{
            color:#16a34a;
        }

        a{
            display:inline-block;

            margin-top:20px;

            padding:12px 20px;

            background:#2563eb;

            color:white;

            text-decoration:none;

            border-radius:10px;
        }

        a:hover{
            background:#1d4ed8;
        }

    </style>

</head>

<body>

<div class="card">

    <h1>✅ Password Changed Successfully</h1>

    <p>
        Your password has been updated.
    </p>

    <a href="{% url 'login' %}">
        Login Now
    </a>

</div>

</body>
</html>
