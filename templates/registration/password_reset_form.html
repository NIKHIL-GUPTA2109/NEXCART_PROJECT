<!DOCTYPE html>
<html>
<head>
    <title>Reset Password | NexCart</title>

    <style>

        body{
            margin:0;
            background:#f5f7fb;
            font-family:Arial,sans-serif;

            display:flex;
            justify-content:center;
            align-items:center;

            height:100vh;
        }

        .card{
            width:450px;
            background:white;

            padding:40px;

            border-radius:18px;

            box-shadow:
            0 10px 30px rgba(0,0,0,.08);
        }

        h1{
            text-align:center;
            color:#111827;
        }

        p{
            color:#666;
            line-height:1.6;
        }

        input{
            width:100%;
            padding:14px;

            border:1px solid #ddd;

            border-radius:10px;

            margin-top:8px;
            margin-bottom:20px;
        }

        button{
            width:100%;
            padding:14px;

            background:#2563eb;

            color:white;

            border:none;

            border-radius:10px;

            font-size:16px;

            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }

    </style>

</head>

<body>

<div class="card">

    <h1>🔐 Reset Password</h1>

    <p>
        Enter your registered email address.
        We'll send you a password reset link.
    </p>

    <form method="post">

        {% csrf_token %}

        <input
        type="email"
        name="email"
        required
        >

        <button type="submit">
            Send Reset Link
        </button>

    </form>

</div>

</body>
</html>
