{% load static %}


<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexCart Login</title>


<link rel="stylesheet" href="{% static 'css/login.css' %}">


</head>
<body>

<div class="login-container">
    <div class="brand-logo">
    <span class="nex">NEX</span><span class="cart">CART</span>
</div>

    <div class="login-card">

        <h2>Sign In 🤘</h2>
        {% if error %}
        <div class="error-message">
         {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">
                    Username
                </label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">
                    Password
                </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="login-btn">
                Sign In
            </button>
            <p>
    <a href="{% url 'password_reset' %}" style="color: #007bff; text-decoration: none;">
        Forgot Password?
    </a>
</p>
        </form>

        <p class="terms">
            By continuing, you agree to NexCart's
            Conditions of Use and Privacy Notice.
        </p>

        <hr>

        <div class="create-account">
            <p>Sign Up 🌟 and Start Shopping. 🛒</p>

            <a href="{% url 'register' %}" class="register-btn">
                Create your NexCart account
            </a>
        </div>

    </div>

</div>


</body>
</html>
